<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Hummus Fit — Receiving Check</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --card:#FFFFFF;
    --card-2:#F5F7F7;
    --line:#E7EAEA;
    --navy:#182B3A;
    --dim:#6B7A80;
    --teal:#2BBFAA;
    --teal-tint:#E5F7F4;
    --orange:#E8612C;
    --orange-tint:#FDEBE3;
    --good:#2BBFAA;
    --good-tint:#E5F7F4;
    --bad:#E14B3D;
    --bad-tint:#FCE7E5;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--navy); font-family:'Inter',sans-serif; min-height:100%;}
  header{
    padding: max(18px, env(safe-area-inset-top)) 5vw 16px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .logo-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .logo-row img{ height:22px; width:auto; display:block; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--dim);
  }
  h1{ font-family:'Poppins', sans-serif; font-weight:800; font-size: 30px; color:var(--navy); margin-top:2px; }
  .date-order-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .info-chip{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    background:var(--card-2); border:1px solid var(--line); color:var(--navy);
    padding:6px 13px; border-radius:999px;
  }
  .info-chip.order{ background:var(--orange-tint); border-color:rgba(232,97,44,0.3); color:var(--orange); }
  .info-chip.crate{ background:var(--teal-tint); border-color:rgba(43,191,170,0.3); color:var(--teal); font-weight:800; }

  main{ padding: 20px 5vw 40px; max-width:640px; margin:0 auto; }

  .picked-by-note{
    display:flex; align-items:center; gap:9px;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--dim);
    margin-bottom:16px;
  }
  .picker-avatar{
    width:26px; height:26px; border-radius:50%; object-fit:cover;
    border:1.5px solid var(--line); flex-shrink:0;
  }
  .picker-avatar.placeholder{
    display:flex; align-items:center; justify-content:center;
    background:var(--teal-tint); color:var(--teal);
    font-family:'Poppins',sans-serif; font-weight:700; font-size:10px;
  }
  .item-row.missing-row{ opacity:0.85; }
  .item-count.missing{
    background:var(--bad-tint); color:var(--bad); white-space:nowrap;
  }

  .eta-card{
    display:flex; align-items:center; gap:12px;
    background:var(--teal-tint); border:1px solid rgba(43,191,170,0.35);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;
  }
  .eta-card.pending{ background:var(--card-2); border-color:var(--line); }
  .eta-dot{ width:10px; height:10px; border-radius:50%; background:var(--dim); flex-shrink:0; }
  .eta-dot.live{ background:var(--teal); box-shadow:0 0 0 4px rgba(43,191,170,0.18); }
  .eta-label{ font-family:'Poppins',sans-serif; font-weight:700; font-size:14.5px; color:var(--navy); }
  .eta-sub{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--dim); margin-top:2px; }

  .received-by-field{
    background:var(--card); border:1.5px solid var(--teal); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:14px;
  }
  .received-by-field label{
    display:block; font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.08em; color:var(--teal); margin-bottom:6px;
  }
  .received-by-field input{
    width:100%; border:1.5px solid var(--line); background:var(--card-2); color:var(--navy);
    font-family:'Poppins',sans-serif; font-weight:600; font-size:15px;
    padding:10px 12px; border-radius:10px; outline:none;
  }
  .received-by-field input:focus{ border-color:var(--teal); }

  .expected-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:8px 16px; margin-bottom:14px;
  }
  .item-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 0; border-top:1px solid var(--line);
  }
  .item-row:first-child{ border-top:none; }
  .item-thumb{
    width:48px; height:48px; border-radius:10px; object-fit:cover;
    background:var(--card-2); flex-shrink:0; border:1px solid var(--line);
  }
  .item-thumb.placeholder{
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:var(--dim);
  }
  .item-title{ font-weight:600; font-size:14px; flex:1; }
  .item-count{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13.5px;
    padding:5px 12px; border-radius:999px; background:var(--card-2); color:var(--dim);
    flex-shrink:0; border:none; cursor:pointer;
  }
  .item-count:active{ opacity:0.7; }
  .item-count.complete{ background:var(--good-tint); color:var(--good); }
  .item-count.scanning{ background:var(--orange-tint); color:var(--orange); }
  .manual-hint{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--dim);
    text-align:center; margin-top:-4px; margin-bottom:4px;
  }

  .scan-btn{
    width:100%; background:var(--navy); color:#fff; border:none;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:16px;
    padding:17px; border-radius:999px; margin-top:20px; cursor:pointer;
  }
  .scan-btn:active{ opacity:0.85; }

  .finish-btn{
    width:100%; background:var(--orange); color:#fff; border:none;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:15px;
    padding:15px; border-radius:999px; margin-top:12px; cursor:pointer;
  }
  .finish-btn:disabled{ opacity:0.4; }

  #scannerOverlay{
    position:fixed; inset:0; background:#000; z-index:200;
    display:none; flex-direction:column;
  }
  #scannerOverlay .scanner-header{
    padding: max(20px, env(safe-area-inset-top)) 20px 16px;
    display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-family:'JetBrains Mono', monospace; font-weight:700;
  }
  #scannerOverlay .scanner-close{ font-size:22px; color:#fff; cursor:pointer; padding:4px 10px; }
  #reader{ flex:1; }
  .scan-progress-label{
    padding: 16px 20px max(16px, env(safe-area-inset-bottom));
    color:#fff; font-weight:700; font-size:15px; text-align:center;
    background: rgba(0,0,0,0.6);
  }

  .empty-state, .error-state{
    text-align:center; padding:60px 20px; color:var(--dim);
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.8;
  }
  .error-state{ color:var(--bad); }
  .error-detail{
    margin-top:16px; text-align:left; background:var(--card); border:1px solid var(--bad);
    border-radius:12px; padding:14px; font-size:11px; word-break:break-word; color:var(--navy);
  }

  .result-banner{
    border-radius:var(--radius); padding:24px; text-align:center; margin-bottom:16px;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:16px;
  }
  .result-banner.good{ background:var(--good-tint); color:var(--good); }
  .result-banner.bad{ background:var(--bad-tint); color:var(--bad); }
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <img src="/assets/logo.png" alt="Hummus Fit">
  </div>
  <div class="eyebrow">Receiving Check</div>
  <h1 id="storeName">Loading…</h1>
  <div class="date-order-row" id="dateOrderRow"></div>
</header>

<main id="mainContent">
  <div class="empty-state">Loading today's delivery…</div>
</main>

<div id="scannerOverlay">
  <div class="scanner-header">
    <span>Scan item barcode</span>
    <span class="scanner-close" id="scannerCloseBtn">✕</span>
  </div>
  <div id="reader"></div>
  <div id="scanProgressLabel" class="scan-progress-label"></div>
</div>

<script>
(function(){
  var storeName = decodeURIComponent(location.pathname.split('/receiving/')[1] || '');
  document.getElementById('storeName').textContent = storeName || 'Unknown Store';

  var todayStr = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'America/New_York' });

  // Route Board's public, CORS-enabled ETA lookup — same server this app
  // already pulls "what was picked" ground truth and picker headshots
  // from, so this doesn't introduce a new dependency.
  var ROUTE_BOARD_URL = 'https://hummusfit-route-board-production.up.railway.app';

  var expected = null;
  var etaInfo = null;
  var scannedCounts = {};
  var html5QrCode = null;
  var lastScanTime = 0;
  var lastScanCode = null;
  var currentlyVisibleCode = null;
  var missedFrameCount = 0;
  var receivedByValue = '';

  function itemKey(item){ return item.sku || item.title; }
  function escapeHtml(s){
    return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  function loadExpected(){
    // Kick off in parallel — the ETA lookup goes straight to Route Board
    // (cross-origin) so it doesn't hold up the expected-items fetch, and
    // a failure here should never block the receiving check itself.
    var etaPromise = fetch(ROUTE_BOARD_URL + '/api/store-eta/' + encodeURIComponent(storeName))
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });

    fetch('/api/expected/' + encodeURIComponent(storeName))
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(result){
        var main = document.getElementById('mainContent');
        var dateRow = document.getElementById('dateOrderRow');
        dateRow.innerHTML = '<span class="info-chip">' + todayStr + '</span>';

        if(!result.ok){
          var detail = '';
          if(result.data.rawResponseStart){
            detail = '<div class="error-detail">Route Board sent back: ' + escapeHtml(result.data.rawResponseStart) + '</div>';
          }
          main.innerHTML = '<div class="error-state">' + escapeHtml(result.data.error || 'No delivery found for this store yet today.') + detail + '</div>';
          return;
        }
        expected = result.data;
        dateRow.innerHTML += '<span class="info-chip order">Order' + (expected.orderName && expected.orderName.indexOf(',') !== -1 ? 's' : '') + ': ' + escapeHtml(expected.orderName || '—') + '</span>';
        dateRow.innerHTML += '<span class="info-chip crate">📦 ' + expected.crateCount + ' crate' + (expected.crateCount === 1 ? '' : 's') + ' expected</span>';
        etaPromise.then(function(eta){
          etaInfo = eta;
          render();
        });
      })
      .catch(function(err){
        document.getElementById('mainContent').innerHTML = '<div class="error-state">Could not reach the server: ' + escapeHtml(err.message) + '</div>';
      });
  }

  function formatEtaTime(iso){
    try{
      return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' });
    } catch(e){ return ''; }
  }

  function etaCardHtml(){
    if(!etaInfo) return '';
    if(!etaInfo.started){
      var sched = etaInfo.scheduledTime ? ' · scheduled ~' + escapeHtml(etaInfo.scheduledTime) : '';
      return '<div class="eta-card pending"><span class="eta-dot"></span><div>'
        + '<div class="eta-label">Delivery not on the road yet</div>'
        + '<div class="eta-sub">' + escapeHtml(etaInfo.routeName || '') + sched + '</div>'
        + '</div></div>';
    }
    if(!etaInfo.eta){
      return '<div class="eta-card pending"><span class="eta-dot"></span><div>'
        + '<div class="eta-label">On the route — arrival time pending</div>'
        + '<div class="eta-sub">' + escapeHtml(etaInfo.routeName || '') + '</div>'
        + '</div></div>';
    }
    var stopsAwayText = etaInfo.stopsAway === 0
      ? 'Next stop'
      : (etaInfo.stopsAway + ' stop' + (etaInfo.stopsAway === 1 ? '' : 's') + ' ahead of you');
    return '<div class="eta-card live"><span class="eta-dot live"></span><div>'
      + '<div class="eta-label">Estimated Arrival: ' + formatEtaTime(etaInfo.eta) + '</div>'
      + '<div class="eta-sub">' + escapeHtml(etaInfo.routeName || '') + ' · ' + stopsAwayText + '</div>'
      + '</div></div>';
  }

  // Reuses the same picker headshots already hosted on Route Board —
  // no need to re-upload the same photo twice. Add more names here as
  // more photos get uploaded; anyone not listed just shows initials.
  var PICKER_PHOTOS = {
    "Hazar Kutuk": "https://hummusfit-route-board-production.up.railway.app/headshots/hazar-kutuk.png"
  };
  function pickerAvatar(name){
    var photoUrl = PICKER_PHOTOS[name];
    if(photoUrl){
      return '<img class="picker-avatar" src="' + escapeHtml(photoUrl) + '" alt="">';
    }
    var initials = (name || '?').split(' ').map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase();
    return '<div class="picker-avatar placeholder">' + escapeHtml(initials) + '</div>';
  }

  function render(){
    var main = document.getElementById('mainContent');
    var html = etaCardHtml();
    html += '<div class="picked-by-note">' + pickerAvatar(expected.pickedBy) + '<span>Picked by ' + escapeHtml(expected.pickedBy || 'Unknown') + '</span></div>';
    html += '<div class="received-by-field">'
      + '<label for="receivedByInput">Received By</label>'
      + '<input type="text" id="receivedByInput" placeholder="Type your name" value="' + escapeHtml(receivedByValue) + '">'
      + '</div>';
    html += '<div class="expected-card">';
    expected.items.forEach(function(item){
      var scanned = scannedCounts[itemKey(item)] || 0;
      var expectedQty = item.pickedQty;
      var thumb = item.imageUrl
        ? '<img class="item-thumb" src="' + escapeHtml(item.imageUrl) + '" alt="">'
        : '<div class="item-thumb placeholder">🍽️</div>';

      // An item marked "missing" during picking never actually got put
      // in the crate — showing it as a plain "0 / 0" would look
      // identical to any other untouched item and easily get missed.
      // Flag it clearly instead so it's obvious why nothing's expected.
      if(item.status === 'missing'){
        html += '<div class="item-row missing-row">'
          + thumb
          + '<span class="item-title">' + escapeHtml(item.title) + '</span>'
          + '<span class="item-count missing">⚠ Missing from picking</span>'
          + '</div>';
        return;
      }

      var cls = scanned >= expectedQty && expectedQty > 0 ? 'complete' : (scanned > 0 ? 'scanning' : '');
      html += '<div class="item-row">'
        + thumb
        + '<span class="item-title">' + escapeHtml(item.title) + '</span>'
        + '<button class="item-count ' + cls + '" data-manual-key="' + escapeHtml(itemKey(item)) + '" data-manual-title="' + escapeHtml(item.title) + '">' + scanned + ' / ' + expectedQty + '</button>'
        + '</div>';
    });
    html += '</div>';
    html += '<div class="manual-hint">Tap any count to type it in by hand if scanning isn\'t cooperating</div>';
    html += '<button class="scan-btn" id="scanBtn">📷 Scan Items</button>';
    html += '<button class="finish-btn" id="finishBtn">✓ Finish Receiving Check</button>';
    main.innerHTML = html;
    document.getElementById('scanBtn').addEventListener('click', openScanner);
    document.querySelectorAll('[data-manual-key]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-manual-key');
        var title = btn.getAttribute('data-manual-title');
        var current = scannedCounts[key] || 0;
        var input = prompt('How many "' + title + '" did you actually count?', current);
        if(input === null) return;
        var num = parseInt(input, 10);
        if(isNaN(num) || num < 0){
          alert('Enter a whole number, 0 or higher.');
          return;
        }
        scannedCounts[key] = num;
        render();
      });
    });
    document.getElementById('finishBtn').addEventListener('click', finishCheck);
    document.getElementById('receivedByInput').addEventListener('input', function(e){
      receivedByValue = e.target.value;
    });
  }

  function openScanner(){
    lastScanTime = 0; lastScanCode = null; currentlyVisibleCode = null; missedFrameCount = 0;
    document.getElementById('scannerOverlay').style.display = 'flex';
    document.getElementById('scanProgressLabel').textContent = 'Point the camera at each item as you unload it';
    if(typeof Html5Qrcode === 'undefined'){
      alert('Scanner failed to load. Check your connection and try again.');
      closeScanner();
      return;
    }
    html5QrCode = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE
      ]
    });
    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 280, height: 140 } },
      handleScanResult,
      function(){
        // Fires every frame where NO code is currently visible. A
        // SINGLE missed frame doesn't mean the item actually left —
        // natural hand shake or a brief autofocus blur can cause one
        // stray miss even while the same barcode is still right there,
        // which was causing it to double-count on the very next
        // successful frame. Only treat it as truly gone after several
        // consecutive misses in a row (roughly half a second at 10fps).
        missedFrameCount++;
        if(missedFrameCount >= 5){
          currentlyVisibleCode = null;
        }
      }
    ).catch(function(err){
      alert('Could not access the camera: ' + err);
      closeScanner();
    });
  }

  function closeScanner(){
    document.getElementById('scannerOverlay').style.display = 'none';
    if(html5QrCode){
      html5QrCode.stop().catch(function(){}).then(function(){
        html5QrCode.clear();
        html5QrCode = null;
      });
    }
  }
  document.getElementById('scannerCloseBtn').addEventListener('click', closeScanner);

  // A short, synthesized beep — no audio file needed. Plus a haptic
  // buzz where the browser supports it (Android Chrome does; iOS
  // Safari currently has no Vibration API at all, so the beep is the
  // real feedback there — the vibrate call is just a harmless no-op
  // on iOS, not an error).
  function playScanFeedback(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'square'; // sharper, more "scanner beep" than a soft sine tone
      osc.frequency.value = 1800;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.09);
    } catch(e){ /* Web Audio unsupported — silently skip, scan still counts */ }
    // Real vibration on a scan — works on Android Chrome. iOS Safari has
    // no Vibration API at all as of now (an Apple platform restriction,
    // not something fixable from the web), so the beep above is the
    // actual feedback on iPhone specifically.
    if(navigator.vibrate) navigator.vibrate(80);
  }

  function handleScanResult(scannedCode){
    var scanned = (scannedCode || '').trim();
    missedFrameCount = 0; // a successful detection means it's still there, whichever code it is

    // Same code still sitting in frame from the last detection — not a
    // new physical item, ignore it until it actually disappears first.
    if(scanned === currentlyVisibleCode) return;
    currentlyVisibleCode = scanned;

    var matchedItem = expected.items.find(function(i){ return (i.sku || '') === scanned; });
    if(!matchedItem){
      scannedCounts['__unexpected__' + scanned] = (scannedCounts['__unexpected__' + scanned] || 0) + 1;
      document.getElementById('scanProgressLabel').textContent = 'Scanned something not on this delivery — noted as extra';
      playScanFeedback();
      return;
    }

    var key = itemKey(matchedItem);
    scannedCounts[key] = (scannedCounts[key] || 0) + 1;
    document.getElementById('scanProgressLabel').textContent =
      matchedItem.title + ': ' + scannedCounts[key] + ' of ' + matchedItem.pickedQty;
    playScanFeedback();
    render();
  }

  function finishCheck(){
    var receivedBy = (document.getElementById('receivedByInput').value || '').trim();
    if(!receivedBy){
      alert('Enter your name in "Received By" before finishing.');
      document.getElementById('receivedByInput').focus();
      return;
    }
    if(!confirm('Finish the receiving check for ' + storeName + '? This locks in what was scanned.')) return;

    fetch('/api/submit-receiving-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        store: storeName,
        orderName: expected.orderName,
        pickedBy: expected.pickedBy,
        receivedBy: receivedBy,
        expectedItems: expected.items,
        scannedCounts: scannedCounts,
      })
    })
      .then(function(r){ return r.json(); })
      .then(function(result){
        var main = document.getElementById('mainContent');
        if(!result.ok){
          main.innerHTML = '<div class="error-state">Could not submit: ' + escapeHtml(result.error || 'unknown error') + '</div>';
          return;
        }
        var hasErrors = result.report.hasErrors;
        var html = '<div class="result-banner ' + (hasErrors ? 'bad' : 'good') + '">'
          + (hasErrors ? '⚠ ' + result.report.errorPercent + '% discrepancy — logged' : '✓ All good — everything matched')
          + '</div>';
        main.innerHTML = html;
      })
      .catch(function(err){
        alert('Could not submit: ' + err.message);
      });
  }

  loadExpected();
})();
</script>

</body>
</html>
