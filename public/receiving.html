<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#245b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Receiving">
<title>Hummus Fit — Receiving Check</title>
<link rel="apple-touch-icon" href="/assets/receiving-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/receiving-policy.js"></script>
<script src="/receiving-barcode.js"></script>
<script src="/receiving-progress.js?v=20261027-2"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --card:#FFFFFF;
    --card-2:#F5F7F7;
    --line:#E7EAEA;
    --navy:#182B3A;
    --dim:#6B7A80;
    --teal:#2BBFAA;
    --teal-tint:#E5F7F4;
    --orange:#E8612C;
    --orange-tint:#FDEBE3;
    --good:#2BBFAA;
    --good-tint:#E5F7F4;
    --bad:#E14B3D;
    --bad-tint:#FCE7E5;
    --radius:16px;
    --shadow-sm: 0 1px 3px rgba(24,43,58,0.06), 0 1px 2px rgba(24,43,58,0.08);
    --shadow-md: 0 4px 14px rgba(24,43,58,0.09), 0 2px 4px rgba(24,43,58,0.06);
    --shadow-lg: 0 10px 30px rgba(24,43,58,0.14), 0 4px 10px rgba(24,43,58,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--navy); font-family:'Inter',sans-serif; min-height:100%;}
  header{
    padding: max(18px, env(safe-area-inset-top)) 5vw 16px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .logo-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .logo-row img{ height:22px; width:auto; display:block; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--dim);
  }
  h1{ font-family:'Poppins', sans-serif; font-weight:800; font-size: 30px; color:var(--navy); margin-top:2px; }
  .date-order-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .info-chip{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    background:var(--card-2); border:1px solid var(--line); color:var(--navy);
    padding:6px 13px; border-radius:999px;
  }
  .info-chip.order{ background:var(--orange-tint); border-color:rgba(232,97,44,0.3); color:var(--orange); }
  .info-chip.crate{ background:var(--teal-tint); border-color:rgba(43,191,170,0.3); color:var(--teal); font-weight:800; }

  main{ padding: 20px 5vw 40px; max-width:640px; margin:0 auto; }

  .picked-by-note{
    display:flex; align-items:center; gap:9px;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--dim);
    margin-bottom:16px;
  }
  .picker-avatar{
    width:26px; height:26px; border-radius:50%; object-fit:cover;
    border:1.5px solid var(--line); flex-shrink:0;
  }
  .picker-avatar.placeholder{
    display:flex; align-items:center; justify-content:center;
    background:var(--teal-tint); color:var(--teal);
    font-family:'Poppins',sans-serif; font-weight:700; font-size:10px;
  }
  .item-row.missing-row{ opacity:0.85; }
  .item-count.missing{
    background:var(--bad-tint); color:var(--bad); white-space:nowrap;
  }
  .category-block{ margin-bottom:16px; }
  .category-heading{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    margin:0 0 8px; padding:0 2px;
  }
  .category-heading strong{ display:block; font-family:'Poppins',sans-serif; font-size:14px; }
  .category-heading small{ display:block; margin-top:2px; color:var(--dim); font-size:10px; line-height:1.35; }
  .category-badge{ padding:5px 9px; border-radius:999px; background:var(--card-2); color:var(--dim); font:700 9px 'JetBrains Mono',monospace; white-space:nowrap; }
  .category-block.retail .category-badge{ background:var(--teal-tint); color:var(--teal); }
  .category-block.other .category-badge{ background:var(--orange-tint); color:var(--orange); }
  .inventory-note{ grid-column:2 / -1; margin-top:2px; color:var(--dim); font-size:9px; line-height:1.35; }

  .eta-card{
    display:flex; align-items:center; gap:12px;
    background:var(--teal-tint); border:1px solid rgba(43,191,170,0.35);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;
    box-shadow: var(--shadow-sm);
  }
  .eta-card.live{ box-shadow: var(--shadow-md), 0 0 0 1px rgba(43,191,170,0.15); }
  .eta-card.pending{ background:var(--card-2); border-color:var(--line); box-shadow:none; }
  .eta-dot{ width:10px; height:10px; border-radius:50%; background:var(--dim); flex-shrink:0; }
  .eta-dot.live{ background:var(--teal); box-shadow:0 0 0 4px rgba(43,191,170,0.18); }
  .eta-label{ font-family:'Poppins',sans-serif; font-weight:700; font-size:14.5px; color:var(--navy); }
  .eta-sub{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--dim); margin-top:2px; }
  .eta-track-link{
    display:inline-block; margin-top:8px;
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700;
    color:var(--teal); text-decoration:none; border-bottom:1px solid rgba(43,191,170,0.4);
  }
  .eta-track-link:active{ opacity:0.7; }

  .received-by-field{
    background:var(--card); border:1.5px solid var(--teal); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:14px;
    box-shadow: var(--shadow-sm), 0 0 0 3px var(--teal-tint);
  }
  .received-by-field label{
    display:block; font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.08em; color:var(--teal); margin-bottom:6px;
  }
  .received-by-field input{
    width:100%; border:1.5px solid var(--line); background:var(--card-2); color:var(--navy);
    font-family:'Poppins',sans-serif; font-weight:600; font-size:15px;
    padding:10px 12px; border-radius:10px; outline:none;
  }
  .received-by-field input:focus{ border-color:var(--teal); }

  .expected-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:8px 16px; margin-bottom:14px;
    box-shadow: var(--shadow-md);
  }
  .item-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:12px 0; border-top:1px solid var(--line);
  }
  .item-row:first-child{ border-top:none; }
  .item-thumb{
    width:48px; height:48px; border-radius:10px; object-fit:cover;
    background:var(--card-2); flex-shrink:0; border:1px solid var(--line);
  }
  /* .item-thumb's base background is --card-2 (light gray) — same gray
     the unresolved row now uses. A placeholder icon with no override
     just disappeared into its own row. Give it a real white circle +
     its own shadow so it reads as a distinct object sitting on top of
     the row, whatever the row's background is. */
  .item-thumb.placeholder{
    display:flex; align-items:center; justify-content:center;
    font-size:19px; color:var(--dim);
    background: #FFFFFF;
    border-radius:50%;
    box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--line);
    border:none;
  }
  .item-title{ font-weight:600; font-size:14px; flex:1; min-width:0; }
  .zero-received-btn{
    flex:0 0 calc(100% - 60px); margin-left:60px; padding:8px 10px;
    border:1px solid var(--orange); border-radius:8px; background:var(--orange-tint);
    color:var(--orange); font-family:'Poppins',sans-serif; font-size:12px;
    font-weight:700; text-align:left; cursor:pointer;
  }
  .zero-received-btn.done{ border-color:var(--good); background:var(--good-tint); color:var(--good); }
  .item-count{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13.5px;
    padding:5px 12px; border-radius:999px; background:var(--card-2); color:var(--dim);
    flex-shrink:0; border:none; cursor:pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .item-count:active{ transform: scale(0.94); box-shadow:none; }
  .item-count.complete{ background:var(--good-tint); color:var(--good); box-shadow: var(--shadow-sm), 0 0 0 1px rgba(43,191,170,0.25); }
  .item-count.scanning{ background:var(--orange-tint); color:var(--orange); box-shadow: var(--shadow-sm), 0 0 0 1px rgba(232,97,44,0.25); }
  .manual-hint{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--dim);
    text-align:center; margin-top:-4px; margin-bottom:4px;
  }

  /* Every non-missing item has to be explicitly touched — either
     confirmed correct or reported with a real count — before Finish
     unlocks. This is what makes that state visible at a glance. */
  /* A full orange-tint fill clashed against product photos that are
     shot on plain white backgrounds — the photo's white square sat on
     top of an orange row and looked broken, not like a UI state. Keep
     the "needs attention" cue as just a left accent stripe on the
     normal white card background instead, so the photo blends in the
     way it does on every other row. */
  .item-row.unresolved{ box-shadow: inset 3px 0 0 var(--orange); background: var(--card-2); }
  .confirm-btn{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line);
    background:var(--card); color:var(--dim); font-size:15px; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .confirm-btn:active{ transform: scale(0.88); }
  .confirm-btn.done{
    background: linear-gradient(135deg, var(--good) 0%, var(--teal-2, #22A895) 100%);
    border-color:var(--good); color:#fff;
    box-shadow: var(--shadow-sm), 0 0 0 4px rgba(43,191,170,0.16);
  }

  .scan-btn{
    width:100%; color:#fff; border:none;
    background: linear-gradient(120deg, var(--navy) 0%, #1F3A4D 60%, #1B4E48 130%);
    font-family:'Poppins',sans-serif; font-weight:700; font-size:16px;
    padding:17px; border-radius:999px; margin-top:20px; cursor:pointer;
    box-shadow: var(--shadow-md), 0 6px 16px rgba(24,43,58,0.25);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .scan-btn:active{ transform: scale(0.98) translateY(1px); box-shadow: var(--shadow-sm); }

  .report-extra-btn{
    width:100%; color:var(--orange); border:1.5px solid rgba(232,97,44,0.4);
    background:#fff;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:14px;
    padding:13px; border-radius:999px; margin-top:10px; cursor:pointer;
  }
  .report-extra-btn:active{ transform: scale(0.98); background:var(--orange-tint); }

  .finish-btn{
    width:100%; color:#fff; border:none;
    background: linear-gradient(120deg, var(--orange) 0%, #F0783F 100%);
    font-family:'Poppins',sans-serif; font-weight:700; font-size:15px;
    padding:15px; border-radius:999px; margin-top:12px; cursor:pointer;
    box-shadow: var(--shadow-md), 0 6px 16px rgba(232,97,44,0.28);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .finish-btn:active{ transform: scale(0.98) translateY(1px); }
  .finish-btn:disabled{ opacity:0.4; }
  .finish-btn.pending{
    background:var(--card-2); color:var(--dim); cursor:not-allowed;
    box-shadow:none; transform:none;
  }

  #scannerOverlay{
    position:fixed; inset:0; background:#000; z-index:200;
    display:none; flex-direction:column;
  }
  #scannerOverlay .scanner-header{
    padding: max(20px, env(safe-area-inset-top)) 20px 16px;
    display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-family:'JetBrains Mono', monospace; font-weight:700;
  }
  #scannerOverlay .scanner-close{ font-size:22px; color:#fff; cursor:pointer; padding:4px 10px; }
  #reader{ flex:1; }
  .scanner-entry{ display:flex; gap:8px; padding:8px 16px; background:#111; }
  .scanner-entry input{ flex:1; min-width:0; padding:12px; border-radius:8px; border:1px solid #777; font-size:16px; }
  .scanner-entry button{ border:0; border-radius:8px; padding:0 14px; font-weight:700; color:#fff; background:var(--teal); }
  .scan-progress-label{
    padding: 16px 20px max(16px, env(safe-area-inset-bottom));
    color:#fff; font-weight:700; font-size:15px; text-align:center;
    background: rgba(0,0,0,0.6);
  }

  .empty-state, .error-state{
    text-align:center; padding:60px 20px; color:var(--dim);
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.8;
  }
  .error-state{ color:var(--bad); }
  .error-detail{
    margin-top:16px; text-align:left; background:var(--card); border:1px solid var(--bad);
    border-radius:12px; padding:14px; font-size:11px; word-break:break-word; color:var(--navy);
  }

  .result-banner{
    border-radius:var(--radius); padding:24px; text-align:center; margin-bottom:16px;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:16px;
  }
  .result-banner.good{ background:var(--good-tint); color:var(--good); }
  .result-banner.bad{ background:var(--bad-tint); color:var(--bad); }
  .result-banner.pending{ background:var(--orange-tint); color:var(--orange); }
  .result-detail{ font-size:12px; line-height:1.5; font-weight:500; margin-top:8px; }

  /* Persistent "extra / wrong item" card — the one thing the old flow
     never gave a store employee: a place to actually SEE what got
     scanned that wasn't on the order, after the one-time toast is gone. */
  .extra-card{
    background:var(--orange-tint); border:1px solid rgba(232,97,44,0.3); border-radius:var(--radius);
    padding:8px 16px; margin-bottom:14px; box-shadow: var(--shadow-sm);
  }
  .extra-card-title{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.08em; color:var(--orange);
    padding:10px 0 6px;
  }
  .extra-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 0; border-top:1px solid rgba(232,97,44,0.22);
  }
  .extra-row:first-of-type{ border-top:none; }
  .extra-code{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px; flex:1; word-break:break-all; }
  .extra-qty{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px;
    color:var(--orange); flex-shrink:0;
  }
  .extra-remove{
    width:26px; height:26px; border-radius:50%; border:1.5px solid rgba(232,97,44,0.35);
    background:#fff; color:var(--orange); font-size:13px; flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .extra-remove:active{ transform:scale(0.9); }
  [hidden]{display:none !important;}
  .extra-code{min-width:0;}
  .extra-code small{display:block;margin-top:4px;line-height:1.4;}
  .extra-row{flex-wrap:wrap;}
  .delivery-search{margin:16px 0;padding:16px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;}
  .delivery-search label{display:block;font-weight:700;margin-bottom:8px;}
  .delivery-search-controls{display:flex;gap:8px;}
  .delivery-search input{min-width:0;flex:1;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px;}
  .delivery-search button,.extra-retry{padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--navy);font:inherit;cursor:pointer;}
  .delivery-search small{display:block;margin-top:8px;color:var(--dim);line-height:1.5;}
  .search-empty{padding:16px;border:1px dashed var(--line);border-radius:10px;}
  .receipt-editor{border:0;padding:0;margin:0;min-width:0;}
  .progress-notice{padding:14px;border-radius:12px;margin:12px 0;background:#e7f3ee;color:#174b42;line-height:1.5;}
  .progress-notice.warning{background:#fff0dd;color:#713a12;}
  .receipt-editor:disabled{opacity:.7;}
  .retry-submit,.confirm-submit{width:100%;padding:16px;margin:8px 0;border-radius:12px;border:0;background:#df5b24;color:white;font-weight:700;font-size:16px;cursor:pointer;}
</style>

<body class="page-receiving-check">

<nav class="hf-appbar store-only-appbar" aria-label="Hummus Fit store receiving">
  <span class="hf-appbar-brand"><span class="hf-logo-frame"><img src="/assets/logo.png" alt="Hummus Fit"></span><span><b>Store Delivery</b><small>Secure receiving check</small></span></span>
  <span class="store-access-label">This store only</span>
</nav>

<header>
  <div class="logo-row">
    <img src="/assets/logo.png" alt="Hummus Fit">
  </div>
  <div class="eyebrow">Receiving Check</div>
  <h1 id="storeName">Loading…</h1>
  <div class="date-order-row" id="dateOrderRow"></div>
</header>

<div id="deliveryUpdate" role="status" aria-live="polite" class="progress-notice warning" style="max-width:820px;margin:16px auto;padding:16px" hidden></div>
<main id="mainContent">
  <div class="empty-state">Loading today's delivery…</div>
</main>

<div id="scannerOverlay">
  <div class="scanner-header">
    <span id="scannerTitle">Scan item barcode</span>
    <span class="scanner-close" id="scannerCloseBtn">✕</span>
  </div>
  <div id="reader"></div>
  <div class="scanner-entry"><input id="handheldBarcode" inputmode="none" autocomplete="off" placeholder="Tap here, then scan with Netum"><button id="handheldSubmit" type="button">Use code</button></div>
  <div id="scanProgressLabel" class="scan-progress-label"></div>
  <p style="padding:12px">Use an exact barcode or SKU. If the code is missing, ask logistics to identify the product before submitting.</p>
</div>

<script>
(function(){
  var storeName = decodeURIComponent(location.pathname.split('/receiving/')[1] || '');
  var storeAccessToken = new URLSearchParams(location.search).get('access') || '';
  document.getElementById('storeName').textContent = storeName || 'Unknown Store';

  var manifest = document.createElement('link');
  manifest.rel = 'manifest';
  manifest.href = '/manifest/' + encodeURIComponent(storeName) + '.webmanifest';
  document.head.appendChild(manifest);
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('/receiving-sw.js').catch(function(){}); });
  }


  // Route Board's public, CORS-enabled ETA lookup — same server this app
  // already pulls "what was picked" ground truth and picker headshots
  // from, so this doesn't introduce a new dependency.
  var ROUTE_BOARD_URL = 'https://hummusfit-route-board-production.up.railway.app';

  var expected = null;
  var etaInfo = null;
  var etaRefreshTimer = null;
  var etaRefreshPending = false;
  var scannedCounts = {};
  // Barcodes that got scanned but don't match anything on this delivery
  // — wrong item, someone else's item, a shelf tag, etc. Kept separate
  // from scannedCounts (which is only ever real expected-item counts)
  // so the two never get confused when building the report. Rendered
  // as its own persistent card below (see extraItemsHtml()) — previously
  // this only ever showed as a toast at the moment of the scan, so a
  // store employee who wasn't staring at the screen at that exact
  // second had no way to ever see it again.
  var extraScans = Object.create(null);
  var extraDetails = Object.create(null);
  // Explicit "this item was actually checked" flag, separate from the
  // count itself — a 0 count is a legitimate "reported missing," but an
  // item nobody ever touched has no business looking the same. Finish
  // stays locked until every non-picking-missing item has one of these.
  var resolvedKeys = {};
  var html5QrCode = null;
  var scanMode = 'expected';
  var extraScanPending = false;
  var lastScanTime = 0;
  var lastScanCode = null;
  var currentlyVisibleCode = null;
  var missedFrameCount = 0;
  var receivedByValue = '';
  var progress = window.HFReceivingProgress;
  if(!progress){
    document.getElementById('mainContent').textContent = 'Receiving could not load safely. Please reload this page; do not start scanning yet.';
    return;
  }
  var progressEnabled = progress.enabled(storeName);
  var draftStore = null, draftProblem = '', lastDraftState = '', draftRestored = false;
  var pendingSubmission = null, finishedReport = null, completedReportId = null, submissionError = '', receiptConflict = false;
  var confirmFinish = false, draftMismatch = false, otherDrafts = [];
  var pendingLookupCount = 0;
  var deliverySearch = '';
  var deliveryRefreshInFlight=false,expectedLoadPending=false;
  if(progressEnabled){
    try { draftStore = progress.create(window.localStorage, storeName); }
    catch(e){ draftProblem = 'Browser storage is unavailable. Keep this page open and enable browser storage before finishing.'; }
  }

  function draftSnapshot(){
    return { expected:expected, scannedCounts:scannedCounts, resolvedKeys:resolvedKeys,
      extraScans:extraScans, extraDetails:extraDetails, receivedBy:receivedByValue,
      pending:pendingSubmission, completedReportId:finishedReport ? finishedReport.id : completedReportId };
  }
  function saveProgress(){
    if(!progressEnabled || !expected) return true;
    if(draftMismatch) return false;
    if(!draftStore) return false;
    var snapshot=draftSnapshot(), state=JSON.stringify(snapshot);
    if(state===lastDraftState && !draftProblem) return true;
    try {
      draftStore.save(snapshot); lastDraftState=state; draftProblem=''; return true;
    } catch(e){ draftProblem=e.message || 'Progress could not be saved. Keep this page open and contact logistics.'; return false; }
  }
  function restoreDraft(draft){
    scannedCounts=draft.scannedCounts || {}; resolvedKeys=draft.resolvedKeys || {};
    extraScans=draft.extraScans || {}; extraDetails=draft.extraDetails || {};
    receivedByValue=draft.receivedBy || ''; pendingSubmission=draft.pending || null;
    completedReportId=draft.completedReportId || null;
    draftRestored=true;
  }
  function initializeProgress(){
    if(!progressEnabled || !draftStore) return;
    try {
      var draft=draftStore.read(expected.orderId);
      if(draft){
        restoreDraft(draft);
        if(progress.signature(draft.expected)!==progress.signature(expected)){
          // Never silently apply old confirmations to changed picking data.
          var current=expected,rebased=progress.rebase?progress.rebase(draft,current):{reviewRequired:true};
          if(!pendingSubmission&&!rebased.reviewRequired){
            draftStore.archive(draft);restoreDraft(rebased.draft);expected=current;
            submissionError=rebased.changedKeys.length?'Picking details were updated. Your counts are preserved; please recheck the changed items.':'Picking details updated. Your saved physical counts are preserved.';
          }else{
            expected=draft.expected;
            if(!pendingSubmission){draftMismatch=true;submissionError='The delivery contents changed. Your original counts are preserved. Contact logistics to review added or removed items before submitting.';}
          }
        }
      }
      otherDrafts=draftStore.list().filter(function(d){return progress.canonical(d.expected.orderId)!==progress.canonical(expected.orderId);});
    } catch(e){ draftProblem=e.message; draftMismatch=true; }
  }
  function lookupBarcode(code){
    pendingLookupCount++;
    return fetch('/api/lookup-received-barcode', {
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({access:storeAccessToken,store:storeName,code:code}),
      signal:AbortSignal.timeout(15000)
    }).then(function(r){return r.ok?r.json():{status:'unavailable'};})
      .finally(function(){pendingLookupCount--;});
  }
  function progressHtml(){
    if(!progressEnabled) return '';
    var warning=draftProblem || submissionError;
    var html='<div class="progress-notice'+(warning?' warning':'')+'" role="status" aria-live="polite">'
      + escapeHtml(warning || (pendingSubmission ? 'Your confirmed counts are saved. Retry sends the same receipt, not another inventory correction.' :
        (draftRestored?'Saved progress restored. ':'')+'Progress is saved automatically on this device. A draft is not a submitted report.'))+'</div>';
    if(draftProblem) html+='<button class="retry-submit" id="saveDraftBtn" type="button">Try saving progress again</button>';
    if(pendingSubmission && !receiptConflict && !draftMismatch) html+='<button class="retry-submit" id="retrySubmitBtn" type="button" '+(submissionInFlight?'disabled':'')+'>'+(submissionInFlight?'Sending saved receipt…':'Retry / confirm saved receipt')+'</button>';
    if(!pendingSubmission && !draftMismatch && otherDrafts.length){
      html+='<div class="progress-notice warning">An unfinished draft for '+escapeHtml(otherDrafts[0].expected.orderName || 'another delivery')+' is also saved on this device. <button id="resumeDraftBtn" type="button">Resume that draft</button></div>';
    }
    return html;
  }
  function bindProgressButtons(){
    var retry=document.getElementById('retrySubmitBtn'); if(retry) retry.onclick=sendPendingReceipt;
    var save=document.getElementById('saveDraftBtn'); if(save) save.onclick=function(){lastDraftState='';saveProgress();render();};
    var resume=document.getElementById('resumeDraftBtn'); if(resume) resume.onclick=function(){
      var draft=draftStore.read(otherDrafts[0].expected.orderId); if(!draft) return;
      expected=draft.expected;restoreDraft(draft);otherDrafts=[];lastDraftState='';
      document.getElementById('dateOrderRow').textContent='Resuming saved delivery '+(expected.orderName || '');
      render();
    };
  }

  // General-purpose tap feedback for every clickable element on this
  // page — same pattern as Route Board's tapFeedback(): one shared
  // AudioContext (browsers cap how many concurrent contexts they'll
  // allow, so don't spin up a new one per tap), a quick descending
  // sine sweep, plus a short haptic buzz. Deliberately a softer/lower
  // tone than playScanFeedback()'s sharp square-wave scanner beep —
  // that one means "a barcode was just read," this one means "you
  // tapped a button," and they shouldn't sound the same.
  var _tapCtx = null;
  function tapFeedback(){
    try{
      if(!_tapCtx) _tapCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(_tapCtx.state === 'suspended') _tapCtx.resume();
      var osc = _tapCtx.createOscillator();
      var gain = _tapCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, _tapCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, _tapCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.18, _tapCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, _tapCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(_tapCtx.destination);
      osc.start();
      osc.stop(_tapCtx.currentTime + 0.1);
    } catch(e){ /* Web Audio unsupported — tap still registers, just silent */ }
    if(navigator.vibrate) navigator.vibrate(18);
  }

  function itemKey(item){ return item.sku || item.title; }
  function categoryForItem(item){
    return window.HFReceivingPolicy ? window.HFReceivingPolicy.categoryForItem(item) : 'food';
  }
  function policyForItem(item){
    return window.HFReceivingPolicy ? window.HFReceivingPolicy.buildReceivingPolicy(item) : { category:'food', inventoryPolicy:'food_existing_flow', projectedPosUnits:0, posInventoryWriteEnabled:false };
  }
  function escapeHtml(s){
    return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  function fetchEta(){
    return fetch('/api/eta/' + encodeURIComponent(storeName) + '?access=' + encodeURIComponent(storeAccessToken))
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }

  function deliveryHeading(data){
    var value=data.deliveryDate ? data.deliveryDate+'T16:00:00Z' : data.completedAt;
    if(!value)return 'Delivery details';
    var date=new Date(value);
    if(!Number.isFinite(date.getTime()))return 'Delivery details';
    return (data.deliveryDate?'Delivery: ':'Picked: ')+date.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'America/New_York'});
  }
  function refreshCurrentDelivery(){
    if(deliveryRefreshInFlight||expectedLoadPending||submissionInFlight||pendingLookupCount||document.visibilityState==='hidden')return;
    deliveryRefreshInFlight=true;
    fetch('/api/expected/'+encodeURIComponent(storeName)+'?access='+encodeURIComponent(storeAccessToken),{cache:'no-store',signal:AbortSignal.timeout(15000)})
      .then(function(r){return r.json().then(function(data){return {ok:r.ok,data:data};});})
      .then(function(result){
        var notice=document.getElementById('deliveryUpdate');
        if(!result.ok){
          if(result.data.code==='current_delivery_unavailable'){
            notice.hidden=false;notice.textContent=result.data.error;
            if(finishedReport)document.getElementById('mainContent').hidden=true;
          }
          return;
        }
        if(!result.data.orderId)return;
        if(expected&&progress.canonical(expected.orderId)===progress.canonical(result.data.orderId)){
          notice.hidden=true;document.getElementById('mainContent').hidden=false;return;
        }
        var hasDraft=pendingSubmission||Object.keys(resolvedKeys).length||Object.keys(extraScans).length||receivedByValue.trim()||draftMismatch||receiptConflict||draftProblem;
        // Completed receipts cannot keep a store stuck on an earlier order.
        // Active or uncertain drafts are preserved and require an explicit switch.
        if(!expected||finishedReport||!hasDraft){location.reload();return;}
        notice.hidden=false;notice.textContent='A new delivery '+(result.data.orderName||'')+' is ready. Your current draft stays saved on this device. ';
        var button=document.createElement('button');button.type='button';button.textContent='Open current delivery';
        button.onclick=function(){if(saveProgress())location.reload();};notice.appendChild(button);
      }).catch(function(){/* Keep saved counts and retry on the next check. */})
      .finally(function(){deliveryRefreshInFlight=false;});
  }

  function loadExpected(){
    expectedLoadPending=true;
    // Kick off in parallel — the ETA lookup goes straight to Route Board
    // (cross-origin) so it doesn't hold up the expected-items fetch, and
    // a failure here should never block the receiving check itself.
    var etaPromise = fetchEta();

    fetch('/api/expected/' + encodeURIComponent(storeName) + '?access=' + encodeURIComponent(storeAccessToken),{cache:'no-store',signal:AbortSignal.timeout(20000)})
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(result){
        var main = document.getElementById('mainContent');
        var dateRow = document.getElementById('dateOrderRow');
        dateRow.innerHTML = '';

        if(!result.ok){
          var detail = '';
          if(result.data.rawResponseStart){
            detail = '<div class="error-detail">Route Board sent back: ' + escapeHtml(result.data.rawResponseStart) + '</div>';
          }
          main.innerHTML = '<div class="error-state">' + escapeHtml(result.data.error || 'No delivery found for this store yet today.') + detail + '</div>';
          return;
        }
        expected = result.data;
        initializeProgress();
        dateRow.innerHTML='<span class="info-chip">'+escapeHtml(deliveryHeading(expected))+'</span>';
        dateRow.innerHTML += '<span class="info-chip order">Order' + (expected.orderName && expected.orderName.indexOf(',') !== -1 ? 's' : '') + ': ' + escapeHtml(expected.orderName || '—') + '</span>';
        dateRow.innerHTML += '<span class="info-chip crate">📦 ' + expected.crateCount + ' crate' + (expected.crateCount === 1 ? '' : 's') + ' expected</span>';
        render(); // Receiving can start immediately; ETA arrives independently.
        if(progressEnabled){
          var checkedOrder=expected.orderId;
          fetch('/api/receiving-receipt/'+encodeURIComponent(storeName)+'?access='+encodeURIComponent(storeAccessToken)+'&orderId='+encodeURIComponent(checkedOrder))
            .then(function(r){return r.json().then(function(data){return {ok:r.ok,data:data};});})
            .then(function(result){
              if(progress.canonical(expected.orderId)!==progress.canonical(checkedOrder)) return;
              if(result.ok && result.data.report && !pendingSubmission){
                // Keep any local draft as evidence; an existing receipt is not
                // permission to overwrite it or start inventory again.
                renderFinishedReport(result.data.report);watchReportStatus(result.data.report);
              } else if(!result.ok){receiptConflict=true;submissionError=result.data.error;render();}
            }).catch(function(){ /* Submission itself remains idempotent. */ });
        }
        etaPromise.then(function(eta){
          if(finishedReport) return;
          etaInfo = eta;
          render();
          if(!etaRefreshTimer){
            etaRefreshTimer = setInterval(function(){
              if(etaRefreshPending) return;
              etaRefreshPending = true;
              fetchEta().then(function(nextEta){
                etaInfo = nextEta;
                if(expected) render();
              }).finally(function(){ etaRefreshPending = false; });
            }, 15000);
          }
        });
      })
      .catch(function(err){
        var drafts=[];
        try { if(draftStore) drafts=draftStore.list(); } catch(e){}
        if(drafts.length){
          expected=drafts[0].expected;draftStore.read(expected.orderId);restoreDraft(drafts[0]);
          submissionError='Connection unavailable. Showing your saved draft for '+(expected.orderName || '')+'. Keep it on this device and retry when connected.';
          render();
        } else {
          document.getElementById('mainContent').innerHTML = '<div class="error-state">Could not reach the server: ' + escapeHtml(err.message) + '. Reload to try again.</div>';
        }
      }).finally(function(){expectedLoadPending=false;});
  }

  function formatEtaTime(iso){
    try{
      return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' });
    } catch(e){ return ''; }
  }

  // Only makes sense once the route is actually out — a van "assigned"
  // to a route that hasn't started yet isn't necessarily on the road at
  // all, so this link only shows once etaInfo.started is true.
  // Matched by IMEI, not van name — Bouncie's own nickname field doesn't
  // reliably match Route Board's van dropdown labels (typos, missing
  // words), so Route Board resolves the exact Bouncie vehicle server-side
  // and hands us its IMEI directly. No vanImei means that van doesn't
  // have a confirmed Bouncie match yet, so skip the link rather than
  // send someone to a tracker page that can't find the vehicle.
  // Points at Fleet Tracker's dedicated single-van page (/track.html),
  // not the main dashboard — that page shows the ENTIRE fleet, which a
  // store employee has no business seeing. /track.html is scoped
  // server-side to just this one van (see fleet-tracker's /api/vehicle/
  // :imei), and it self-checks delivery status against Route Board so
  // tracking actually stops once the drop-off happens, even if someone
  // bookmarks the link. Never shown once delivered — that's redundant
  // once it's here, and matches what /track.html would show anyway.
  function vanTrackLinkHtml(){
    if(!etaInfo || !etaInfo.started || !etaInfo.trackingAvailable || !etaInfo.van || !etaInfo.trackUrl) return '';
    return '<a class="eta-track-link" data-tap-link href="' + escapeHtml(etaInfo.trackUrl) + '" target="_blank" rel="noopener noreferrer">📍 Track ' + escapeHtml(etaInfo.van) + ' live</a>';
  }

  function etaCardHtml(){
    if(!etaInfo) return '';
    if(etaInfo.delivered){
      var deliveredTime = etaInfo.deliveredAt ? formatEtaTime(etaInfo.deliveredAt) : '';
      return '<div class="eta-card live"><span class="eta-dot live"></span><div>'
        + '<div class="eta-label">✓ Delivered' + (deliveredTime ? ' at ' + deliveredTime : '') + '</div>'
        + '<div class="eta-sub">' + escapeHtml(etaInfo.routeName || '') + '</div>'
        + vanTrackLinkHtml()
        + '</div></div>';
    }
    if(!etaInfo.started){
      var sched = etaInfo.scheduledTime ? ' · scheduled ~' + escapeHtml(etaInfo.scheduledTime) : '';
      return '<div class="eta-card pending"><span class="eta-dot"></span><div>'
        + '<div class="eta-label">Delivery not on the road yet</div>'
        + '<div class="eta-sub">' + escapeHtml(etaInfo.routeName || '') + sched + '</div>'
        + '</div></div>';
    }
    if(!etaInfo.eta){
      return '<div class="eta-card pending"><span class="eta-dot"></span><div>'
        + '<div class="eta-label">On the route — arrival time pending</div>'
        + '<div class="eta-sub">' + escapeHtml(etaInfo.routeName || '') + '</div>'
        + vanTrackLinkHtml()
        + '</div></div>';
    }
    var stopsAwayText = etaInfo.stopsAway === 0
      ? 'Next stop'
      : (etaInfo.stopsAway + ' stop' + (etaInfo.stopsAway === 1 ? '' : 's') + ' ahead of you');
    var freshnessText = etaInfo.etaSource === 'live-traffic'
      ? ' · Updates as the van moves'
      : ' · Initial estimate; live update unavailable';
    return '<div class="eta-card live"><span class="eta-dot live"></span><div>'
      + '<div class="eta-label">Estimated Arrival: ' + formatEtaTime(etaInfo.eta) + '</div>'
      + '<div class="eta-sub">' + escapeHtml(etaInfo.routeName || '') + ' · ' + stopsAwayText + freshnessText + '</div>'
      + vanTrackLinkHtml()
      + '</div></div>';
  }

  // Reuses the same picker headshots already hosted on Route Board —
  // no need to re-upload the same photo twice. Add more names here as
  // more photos get uploaded; anyone not listed just shows initials.
  var PICKER_PHOTOS = {
    "Hazar Kutuk": "https://hummusfit-route-board-production.up.railway.app/headshots/hazar-kutuk.png"
  };
  function pickerAvatar(name){
    var photoUrl = PICKER_PHOTOS[name];
    if(photoUrl){
      return '<img class="picker-avatar" src="' + escapeHtml(photoUrl) + '" alt="">';
    }
    var initials = (name || '?').split(' ').map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase();
    return '<div class="picker-avatar placeholder">' + escapeHtml(initials) + '</div>';
  }

  // Renders as its own orange card right under the expected-items list —
  // stays on screen for the rest of the check (and gets sent up with the
  // report, see finishCheck()), instead of vanishing the instant the
  // scan-progress toast text changes to the next thing.
  function extraItemsHtml(){
    var codes = Object.keys(extraScans);
    if(codes.length === 0) return '';
    var html = '<div class="extra-card">';
    html += '<div class="extra-card-title">⚠ Not on this order</div>';
    codes.forEach(function(code){
      var detail = extraDetails[code] || {};
      html += '<div class="extra-row">'
        + '<span class="extra-code">' + escapeHtml(detail.title || code)
        + '<small>' + escapeHtml(code) + ' · ' + (detail.lookupStatus==='matched'?'Product identified':detail.lookupStatus==='pending'?'Checking product…':'Unverified — scan again or ask logistics') + '</small></span>'
        + (/^[A-Za-z0-9_-]{5,60}$/.test(code) && detail.lookupStatus!=='matched' ? '<button type="button" class="extra-retry" data-retry-extra="'+escapeHtml(code)+'" '+(pendingLookupCount?'disabled':'')+'>Check code again</button>' : '')
        + '<span class="extra-qty">×' + extraScans[code] + '</span>'
        + '<button class="extra-remove" data-remove-extra="' + escapeHtml(code) + '" title="Remove — scanned by mistake">✕</button>'
        + '</div>';
    });
    html += '</div>';
    return html;
  }

  function blockedExtraCodes(){
    var seen=Object.create(null);
    return Object.keys(extraScans).filter(function(code){
      var detail=extraDetails[code] || {};
      var duplicate=!!seen[detail.sku];seen[detail.sku]=true;
      return !/^[A-Za-z0-9_-]{5,60}$/.test(code) || detail.source==='manual' || detail.lookupStatus!=='matched'
        || duplicate || extraScans[code]>1000 || expected.items.some(function(item){return item.sku===detail.sku;});
    });
  }

  function retryExtraLookup(code){
    if(pendingLookupCount || pendingSubmission || finishedReport) return;
    extraDetails[code]=Object.assign({},extraDetails[code],{lookupStatus:'pending'});
    var request=lookupBarcode(code);render();
    request.then(function(result){
      if(!extraScans[code])return;
      extraDetails[code]={source:'entered',lookupStatus:result.status,
        title:result.status==='matched'?result.title:'',sku:result.status==='matched'?result.sku:''};
    }).catch(function(){if(extraDetails[code])extraDetails[code].lookupStatus='unavailable';})
      .finally(function(){render();});
  }

  function applyDeliverySearch(){
    var terms=deliverySearch.toLowerCase().trim().split(/\s+/).filter(Boolean),shown=0;
    document.querySelectorAll('[data-item-search]').forEach(function(row){
      var text=row.getAttribute('data-item-search').toLowerCase();
      row.hidden=!terms.every(function(term){return text.indexOf(term)!==-1;});
      if(!row.hidden)shown++;
    });
    document.querySelectorAll('[data-receiving-section]').forEach(function(section){
      section.hidden=!Array.from(section.querySelectorAll('[data-item-search]')).some(function(row){return !row.hidden;});
    });
    var summary=document.getElementById('deliverySearchSummary');
    if(summary)summary.textContent='Showing '+shown+' of '+expected.items.length+' items. Every item still needs a check before finishing.';
    var empty=document.getElementById('deliverySearchEmpty');if(empty)empty.hidden=shown!==0;
    var clear=document.getElementById('clearDeliverySearch');if(clear)clear.hidden=!deliverySearch;
  }

  function itemSearchAttribute(item){
    return ' data-item-search="'+escapeHtml([item.title,item.sku,item.barcode].concat(item.scanCodes || []).join(' '))+'"';
  }

  function render(){
    if(finishedReport) return; // ETA polling must never reopen a submitted form.
    saveProgress();
    var main = document.getElementById('mainContent');
    var active=document.activeElement,searchFocused=active && active.id==='deliverySearch';
    var searchSelection=searchFocused?active.selectionStart:null;
    var html = progressHtml()+etaCardHtml();
    html += '<fieldset class="receipt-editor" '+(progressEnabled && (pendingSubmission || draftMismatch || receiptConflict)?'disabled':'')+'>';
    html += '<div class="picked-by-note">' + pickerAvatar(expected.pickedBy) + '<span>Picked by ' + escapeHtml(expected.pickedBy || 'Unknown') + '</span></div>';
    html += '<div class="received-by-field">'
      + '<label for="receivedByInput">Received By</label>'
      + '<input type="text" id="receivedByInput" placeholder="Type your name" value="' + escapeHtml(receivedByValue) + '">'
      + '</div>';
    // Items already flagged "missing" back at picking don't need a
    // second confirmation here — that discrepancy is already logged on
    // the picker's side. Everything else has to be explicitly resolved
    // (confirmed correct, or reported with a real count) before Finish
    // unlocks, so a blank-scroll-through can't slip past as "all good."
    var requiredKeys = expected.items.filter(function(it){ return it.status !== 'missing'; }).map(itemKey);
    var unresolvedCount = requiredKeys.filter(function(k){ return !resolvedKeys[k]; }).length;

    html += '<div class="delivery-search"><label for="deliverySearch">Search this delivery</label>'
      + '<div class="delivery-search-controls"><input id="deliverySearch" type="search" placeholder="Product name, SKU or barcode" autocomplete="off" value="'+escapeHtml(deliverySearch)+'" aria-describedby="deliverySearchSummary">'
      + '<button id="clearDeliverySearch" type="button">Clear</button></div><small id="deliverySearchSummary" role="status" aria-live="polite"></small></div>'
      + '<div id="deliverySearchEmpty" class="search-empty" hidden>No matching items in this delivery. Try another name, SKU or barcode, or clear the search to see all items.</div>';
    var categorySections = [
      { key:'food', cls:'food', title:'Food delivery', note:'Current receiving and inventory process remains unchanged.', badge:'CURRENT FLOW' },
      { key:'retail_essentials', cls:'retail', title:'Retail Essentials', note:'Confirm each case. Mapped items post as sell-units to this store after the receipt is submitted.', badge:'POS UNITS ON RECEIPT' },
      { key:'other_essentials', cls:'other', title:'Other Essentials', note:'Store supplies only. These items never enter POS inventory.', badge:'NO POS' }
    ];
    categorySections.forEach(function(section){
      var sectionItems = expected.items.filter(function(item){ return categoryForItem(item) === section.key; });
      if(!sectionItems.length) return;
      html += '<section data-receiving-section class="category-block ' + section.cls + '">'
        + '<div class="category-heading"><div><strong>' + section.title + '</strong><small>' + section.note + '</small></div><span class="category-badge">' + section.badge + '</span></div>'
        + '<div class="expected-card">';
      sectionItems.forEach(function(item){
      var key = itemKey(item);
      var scanned = scannedCounts[key] || 0;
      var expectedQty = item.pickedQty;
      var receivingPolicy = policyForItem(item);
      var thumb = item.imageUrl
        ? '<img class="item-thumb" src="' + escapeHtml(item.imageUrl) + '" alt="">'
        : '<div class="item-thumb placeholder">🍽️</div>';

      // An item marked "missing" during picking never actually got put
      // in the crate — showing it as a plain "0 / 0" would look
      // identical to any other untouched item and easily get missed.
      // Flag it clearly instead so it's obvious why nothing's expected.
      if(item.status === 'missing'){
        html += '<div class="item-row missing-row"'+itemSearchAttribute(item)+'>'
          + thumb
          + '<span class="item-title">' + escapeHtml(item.title) + '</span>'
          + '<span class="item-count missing">⚠ Missing from picking</span>'
          + '</div>';
        return;
      }

      var resolved = !!resolvedKeys[key];
      var cls = scanned >= expectedQty && expectedQty > 0 ? 'complete' : (scanned > 0 ? 'scanning' : '');
      var zeroReceived = resolved && scanned === 0;
      html += '<div class="item-row' + (resolved ? '' : ' unresolved') + '"'+itemSearchAttribute(item)+'>'
        + thumb
        + '<span class="item-title">' + escapeHtml(item.title) + '</span>'
        + '<button class="item-count ' + cls + '" data-manual-key="' + escapeHtml(key) + '" data-manual-title="' + escapeHtml(item.title) + '">' + scanned + ' / ' + expectedQty + '</button>'
        + '<button class="confirm-btn' + (resolved && !zeroReceived ? ' done' : '') + '" data-confirm-key="' + escapeHtml(key) + '" data-confirm-qty="' + expectedQty + '" title="Mark the full picked quantity as received">' + (resolved && !zeroReceived ? '✓' : '☐') + '</button>'
        + ((!resolved || zeroReceived) && expectedQty > 0
          ? '<button type="button" class="zero-received-btn' + (zeroReceived ? ' done' : '') + '" data-zero-key="' + escapeHtml(key) + '" data-zero-title="' + escapeHtml(item.title) + '">' + (zeroReceived ? '✓ Didn’t come — 0 received' : 'Didn’t come — mark 0 received') + '</button>'
          : '')
        + (receivingPolicy.category === 'retail_essentials' && receivingPolicy.unitsPerCase > 0
          ? '<span class="inventory-note">' + receivingPolicy.pickedCases + ' case(s) × ' + receivingPolicy.unitsPerCase + ' = ' + receivingPolicy.projectedPosUnits + ' POS units when this receipt is verified. Unmapped items need review.</span>'
          : receivingPolicy.category === 'other_essentials'
            ? '<span class="inventory-note">Receipt confirmation only — this item will never update POS inventory.</span>'
            : '')
        + '</div>';
      });
      html += '</div></section>';
    });
    html += extraItemsHtml();
    html += '<div class="manual-hint">Scan each item, or tap ☐ to confirm the count shown is correct, or tap the number to type in what you actually counted</div>';
    html += '<button class="scan-btn" id="scanBtn">📷 Scan Items</button>';
    html += '<button class="report-extra-btn" id="reportExtraBtn">⚠ Scan Wrong / Extra Item</button>';
    var blockedExtras=progressEnabled?blockedExtraCodes():[];
    if(blockedExtras.length){
      html += '<div class="progress-notice warning">An extra item needs verification, has a duplicate product code, or belongs on an existing order line. Scan its exact barcode/SKU again, or ask logistics to identify it. For an item already on this delivery, enter its total on the order line and remove the duplicate extra. Keep all physical discrepancies recorded before submitting.</div>';
    }
    if(pendingLookupCount || blockedExtras.length){
      html += '<button class="finish-btn pending" id="finishBtn" disabled>'+(pendingLookupCount?'Checking product codes…':'Verify wrong / extra items before finishing')+'</button>';
    } else if(unresolvedCount > 0){
      html += '<button class="finish-btn pending" id="finishBtn" disabled>⚠ Confirm ' + unresolvedCount + ' more item' + (unresolvedCount === 1 ? '' : 's') + ' before finishing</button>';
    } else {
      html += '<button class="finish-btn" id="finishBtn">✓ Finish Receiving Check</button>';
    }
    html += '</fieldset>';
    if(progressEnabled && confirmFinish && !pendingSubmission){
      html+='<div class="progress-notice warning">Confirm these are the actual counts received, including zeros and wrong/extra items. This submits the report and starts verification.</div><button class="confirm-submit" id="confirmSubmitBtn" type="button">Confirm and submit receiving report</button><button id="cancelSubmitBtn" type="button">Keep checking</button>';
    }
    main.innerHTML = html;
    applyDeliverySearch();
    var searchInput=document.getElementById('deliverySearch');
    searchInput.addEventListener('input',function(){deliverySearch=this.value;applyDeliverySearch();});
    document.getElementById('clearDeliverySearch').onclick=function(){deliverySearch='';searchInput.value='';applyDeliverySearch();searchInput.focus();};
    if(searchFocused){searchInput.focus();try{searchInput.setSelectionRange(searchSelection,searchSelection);}catch(e){}}
    document.querySelectorAll('[data-retry-extra]').forEach(function(btn){btn.onclick=function(){retryExtraLookup(btn.getAttribute('data-retry-extra'));};});
    bindProgressButtons();
    var confirmButton=document.getElementById('confirmSubmitBtn'); if(confirmButton) confirmButton.onclick=prepareSubmission;
    var cancelButton=document.getElementById('cancelSubmitBtn'); if(cancelButton) cancelButton.onclick=function(){confirmFinish=false;render();};
    document.getElementById('scanBtn').addEventListener('click', function(){ tapFeedback(); openScanner(); });
    document.getElementById('reportExtraBtn').addEventListener('click', function(){ tapFeedback(); openScanner('extra'); });
    document.querySelectorAll('[data-manual-key]').forEach(function(btn){
      btn.addEventListener('click', function(){
        tapFeedback();
        var key = btn.getAttribute('data-manual-key');
        var title = btn.getAttribute('data-manual-title');
        var current = scannedCounts[key] || 0;
        var input = prompt('How many "' + title + '" did you actually count?', current);
        if(input === null) return;
        var value=input.trim(),num=Number(value);
        if(!/^\d+$/.test(value) || !Number.isSafeInteger(num) || num < 0 || num > 100000){
          alert('Enter a whole number from 0 to 100000. Nothing was changed.');
          return;
        }
        scannedCounts[key] = num;
        resolvedKeys[key] = true;
        render();
      });
    });
    document.querySelectorAll('[data-confirm-key]').forEach(function(btn){
      btn.addEventListener('click', function(){
        tapFeedback();
        var key = btn.getAttribute('data-confirm-key');
        var qty = parseInt(btn.getAttribute('data-confirm-qty'), 10) || 0;
        // Fast path for "I looked, the count's right" without scanning
        // or typing — still an explicit tap, still logged as a real
        // confirmation, just faster for the common case.
        scannedCounts[key] = qty;
        resolvedKeys[key] = true;
        render();
      });
    });
    document.querySelectorAll('[data-zero-key]').forEach(function(btn){
      btn.addEventListener('click', function(){
        tapFeedback();
        var key = btn.getAttribute('data-zero-key');
        var current = scannedCounts[key] || 0;
        if(current > 0 && !confirm('You counted ' + current + ' of "' + btn.getAttribute('data-zero-title') + '". Change that to 0 received?')) return;
        scannedCounts[key] = 0;
        resolvedKeys[key] = true;
        confirmFinish = false;
        render();
      });
    });
    // Always bind the click handler, even while the button shows
    // disabled — native disabled buttons already block real taps, but
    // the actual protection is the unresolved-items check inside
    // finishCheck() itself, so it has to run for real if this ever gets
    // triggered some other way (e.g. the disabled attribute getting
    // stripped via devtools).
    document.getElementById('finishBtn').addEventListener('click', function(){ tapFeedback(); finishCheck(); });
    document.getElementById('receivedByInput').addEventListener('input', function(e){
      receivedByValue = e.target.value;
      saveProgress();
      if(draftProblem){var status=document.querySelector('[role="status"]');if(status)status.textContent=draftProblem;}
    });
    document.querySelectorAll('[data-tap-link]').forEach(function(link){
      link.addEventListener('click', function(){ tapFeedback(); });
    });
    document.querySelectorAll('[data-remove-extra]').forEach(function(btn){
      btn.addEventListener('click', function(){
        tapFeedback();
        var code = btn.getAttribute('data-remove-extra');
        delete extraScans[code];
        delete extraDetails[code];
        render();
      });
    });
  }

  function openScanner(mode){
    if(progressEnabled && (pendingSubmission || finishedReport || receiptConflict || draftMismatch)) return;
    scanMode = mode === 'extra' ? 'extra' : 'expected';
    extraScanPending = false;
    lastScanTime = 0; lastScanCode = null; currentlyVisibleCode = null; missedFrameCount = 0;
    document.getElementById('scannerOverlay').style.display = 'flex';
    document.getElementById('scannerTitle').textContent = scanMode === 'extra' ? 'Scan the wrong / extra item' : 'Scan item barcode';
    document.getElementById('scanProgressLabel').textContent = scanMode === 'extra'
      ? 'Scan its physical barcode with the camera or Netum. Unknown items stay pending review.'
      : 'Point the camera at each item as you unload it';
    if(typeof Html5Qrcode === 'undefined'){
      document.getElementById('scanProgressLabel').textContent = 'Camera scanner unavailable. Use the Netum scanner or enter the exact barcode below.';
      document.getElementById('handheldBarcode').focus();
      return;
    }
    html5QrCode = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE
      ]
    });
    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 280, height: 140 } },
      handleScanResult,
      function(){
        // Fires every frame where NO code is currently visible. A
        // SINGLE missed frame doesn't mean the item actually left —
        // natural hand shake or a brief autofocus blur can cause one
        // stray miss even while the same barcode is still right there,
        // which was causing it to double-count on the very next
        // successful frame. Only treat it as truly gone after several
        // consecutive misses in a row (roughly half a second at 10fps).
        missedFrameCount++;
        if(missedFrameCount >= 5){
          currentlyVisibleCode = null;
        }
      }
    ).catch(function(err){
      document.getElementById('scanProgressLabel').textContent = 'Camera unavailable. Use the Netum scanner or enter the exact barcode below.';
      html5QrCode = null;
      document.getElementById('handheldBarcode').focus();
    });
  }

  function closeScanner(){
    scanMode = 'expected';
    document.getElementById('scannerOverlay').style.display = 'none';
    if(html5QrCode){
      html5QrCode.stop().catch(function(){}).then(function(){
        html5QrCode.clear();
        html5QrCode = null;
      });
    }
  }
  document.getElementById('scannerCloseBtn').addEventListener('click', function(){ tapFeedback(); closeScanner(); });
  function submitHandheldBarcode(){
    var input = document.getElementById('handheldBarcode');
    var code = input.value.trim();
    input.value = '';
    if(!code) return;
    currentlyVisibleCode = null;
    handleScanResult(code, 'entered');
    input.focus();
  }
  document.getElementById('handheldSubmit').addEventListener('click', submitHandheldBarcode);
  document.getElementById('handheldBarcode').addEventListener('keydown', function(event){
    if(event.key === 'Enter'){ event.preventDefault(); submitHandheldBarcode(); }
  });

  // A short, synthesized beep — no audio file needed. Plus a haptic
  // buzz where the browser supports it (Android Chrome does; iOS
  // Safari currently has no Vibration API at all, so the beep is the
  // real feedback there — the vibrate call is just a harmless no-op
  // on iOS, not an error).
  function playScanFeedback(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'square'; // sharper, more "scanner beep" than a soft sine tone
      osc.frequency.value = 1800;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.09);
    } catch(e){ /* Web Audio unsupported — silently skip, scan still counts */ }
    // Real vibration on a scan — works on Android Chrome. iOS Safari has
    // no Vibration API at all as of now (an Apple platform restriction,
    // not something fixable from the web), so the beep above is the
    // actual feedback on iPhone specifically.
    if(navigator.vibrate) navigator.vibrate(80);
  }

  function countExpectedItem(matchedItem){
    if(progressEnabled && (pendingSubmission || finishedReport)) return;
    var key = itemKey(matchedItem);
    scannedCounts[key] = (scannedCounts[key] || 0) + 1;
    resolvedKeys[key] = true;
    document.getElementById('scanProgressLabel').textContent =
      matchedItem.title + ': ' + scannedCounts[key] + ' of ' + matchedItem.pickedQty;
    playScanFeedback();
    render();
  }

  function handleScanResult(scannedCode, source){
    if(document.getElementById('scannerOverlay').style.display !== 'flex') return;
    var scanned = (scannedCode || '').trim();
    if(!scanned) return;
    if(!/^[A-Za-z0-9_-]{5,60}$/.test(scanned)){
      document.getElementById('scanProgressLabel').textContent='Use an exact barcode or SKU. Product descriptions cannot be submitted.';
      return;
    }
    missedFrameCount = 0; // a successful detection means it's still there, whichever code it is

    // Same code still sitting in frame from the last detection — not a
    // new physical item, ignore it until it actually disappears first.
    if(scanned === currentlyVisibleCode) return;
    currentlyVisibleCode = scanned;

    if(scanMode === 'extra'){
      if(extraScanPending) return;
      extraScanPending = true;
      closeScanner();
      var qtyText = prompt('How many ADDITIONAL physical items have barcode ' + scanned + '? Do not include items already counted.', '1');
      if(qtyText === null){ extraScanPending = false; return; }
      qtyText = qtyText.trim();
      var extraQty = Number(qtyText);
      if(!/^\d+$/.test(qtyText) || !Number.isSafeInteger(extraQty) || extraQty < 1 || extraQty > 1000){
        alert('Enter a whole-number quantity from 1 to 1000. Nothing was added.');
        extraScanPending = false;
        return;
      }
      extraScans[scanned] = (extraScans[scanned] || 0) + extraQty;
      extraDetails[scanned] = { source:source === 'entered' ? 'entered' : 'scan', lookupStatus:'pending' };
      playScanFeedback();
      render();
      lookupBarcode(scanned)
      .then(function(result){
        if(!extraScans[scanned]) return;
        extraDetails[scanned] = { source:source === 'entered' ? 'entered' : 'scan', lookupStatus:result.status,
          title:result.status === 'matched' ? result.title : '', sku:result.status === 'matched' ? result.sku : '' };
        var onOrder=result.status==='matched' ? expected.items.filter(function(item){return item.sku===result.sku;}) : [];
        if(onOrder.length===1){
          var key=itemKey(onOrder[0]);
          var totalText=prompt(result.title+' is already on this order. Enter the TOTAL received in this delivery, including all normal and extra items. This replaces its previous count of '+(scannedCounts[key]||0)+'.',String((scannedCounts[key]||0)+extraScans[scanned]));
          var confirmed=window.HFReceivingBarcode.confirmedTotal(totalText);
          if(confirmed!==null){
            scannedCounts[key]=confirmed;
            resolvedKeys[key]=true;
            Object.keys(extraDetails).forEach(function(code){
              if(extraDetails[code].lookupStatus==='matched'&&extraDetails[code].sku===result.sku){delete extraDetails[code];delete extraScans[code];}
            });
          } else if(totalText!==null){alert('The total must be a whole number from 0 to 1000. The extra item remains flagged for review.');}
        }
        render();
      }).catch(function(){
        if(!extraScans[scanned]) return;
        extraDetails[scanned] = { source:source === 'entered' ? 'entered' : 'scan', lookupStatus:'unavailable' };
        render();
      }).finally(function(){ extraScanPending = false; });
      return;
    }

    var matchedItem = window.HFReceivingBarcode.expectedItem(expected.items, scanned);
    if(matchedItem){ countExpectedItem(matchedItem); return; }
    document.getElementById('scanProgressLabel').textContent = 'Checking barcode against the product catalog…';
    lookupBarcode(scanned)
    .then(function(result){
      var knownOrderItem = result.status === 'matched' ? expected.items.filter(function(item){ return item.sku === result.sku; }) : [];
      if(knownOrderItem.length === 1){ countExpectedItem(knownOrderItem[0]); return; }
      extraScans[scanned] = (extraScans[scanned] || 0) + 1;
      extraDetails[scanned] = { source:source === 'entered' ? 'entered' : 'scan', title:result.status === 'matched' ? result.title : '',
        sku:result.status === 'matched' ? result.sku : '', lookupStatus:result.status };
      document.getElementById('scanProgressLabel').textContent = result.status === 'matched'
        ? result.title + ' is not on this order — inventory review required'
        : 'Barcode not on this order — inventory review required';
      playScanFeedback();
      render();
    }).catch(function(){
      extraScans[scanned] = (extraScans[scanned] || 0) + 1;
      extraDetails[scanned] = { source:source === 'entered' ? 'entered' : 'scan', lookupStatus:'unavailable' };
      document.getElementById('scanProgressLabel').textContent = 'Catalog unavailable — barcode saved for review';
      playScanFeedback();
      render();
    });
  }

  var submissionInFlight = false;
  var reportStatusTimer = null;

  function reportIsRetrying(report){
    return (report.automation && ['queued','processing','retry'].indexOf(report.automation.status)!==-1) ||
      (report.nextFoodRetryAt && Number(report.foodRetryAttempts || 0) < 12) ||
      (report.nextRetailRetryAt && Number(report.retailRetryAttempts || 0) < 12);
  }

  function renderFinishedReport(report){
    finishedReport=report;
    if(etaRefreshTimer){clearInterval(etaRefreshTimer);etaRefreshTimer=null;}
    var main = document.getElementById('mainContent');
    var status = report.inventoryReconciliation || {};
    var retrying = reportIsRetrying(report);
    var good = ['corrected', 'conversion_posted', 'receipt_verified'].includes(status.status);
    var savedAt=Number.isFinite(Date.parse(report.submittedAt))?new Date(report.submittedAt).toLocaleString('en-US',{month:'long',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}):'';
    var html = '<div class="progress-notice">✓ Receiving report saved. '+(savedAt?'Submitted '+escapeHtml(savedAt)+' Eastern. ':'')+'Reference: '+escapeHtml(report.id)+'. Do not submit this delivery again.</div>';
    html += '<div class="result-banner ' + (report.hasErrors ? 'bad' : 'good') + '">'
      + (report.hasErrors ? '⚠ ' + report.errorPercent + '% receiving discrepancy recorded' : '✓ All items matched')
      + '</div>';
    html += '<div class="result-banner ' + (good ? 'good' : retrying ? 'pending' : 'bad') + '">'
      + (retrying && !good ? '⏳ Posting inventory correction now' : escapeHtml(status.label || 'Inventory status not confirmed'))
      + (status.correctedAt ? '<div class="result-detail">Shopify confirmed ' + escapeHtml(new Date(status.correctedAt).toLocaleString()) + '</div>' : '')
      + '<div class="result-detail">' + escapeHtml(status.detail || 'Logistics will review this receipt.') + '</div>'
      + '</div>';
    if(status.correctionLines && status.correctionLines.length){
      html += '<div class="result-detail">' + status.correctionLines.map(function(line){
        return escapeHtml(line.title + ': ' + (line.status === 'corrected' ? 'Shopify adjustment confirmed' : 'not yet corrected'));
      }).join('<br>') + '</div>';
    }
    main.innerHTML = html;
  }

  function watchReportStatus(report){
    if(reportStatusTimer) clearInterval(reportStatusTimer);
    if(!reportIsRetrying(report)) return;
    reportStatusTimer = setInterval(function(){
      fetch('/api/receiving-report-status', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ store: storeName, access: storeAccessToken, reportId: report.id })
      }).then(function(response){ return response.json(); }).then(function(result){
        if(!result.ok || !result.report) return;
        renderFinishedReport(result.report);
        if(!reportIsRetrying(result.report)){
          clearInterval(reportStatusTimer);
          reportStatusTimer = null;
        }
      }).catch(function(){ /* Keep the last verified state and try again. */ });
    }, 5000);
  }

  function finishCheck(){
    if(submissionInFlight) return;
    if(progressEnabled && (pendingSubmission || finishedReport || receiptConflict || draftMismatch)) return;
    if(progressEnabled && blockedExtraCodes().length){submissionError='Verify every wrong/extra product code before submitting. Your draft is saved.';render();return;}
    if(pendingLookupCount){submissionError='Please wait for the barcode lookup to finish before submitting.';render();return;}
    // Belt-and-suspenders: the button itself is disabled while items are
    // unresolved, but this is the actual gate that decides whether a
    // submission is allowed through, so it has to hold even if the
    // button's disabled state is ever bypassed.
    var requiredKeys = expected.items.filter(function(it){ return it.status !== 'missing'; }).map(itemKey);
    var stillUnresolved = requiredKeys.filter(function(k){ return !resolvedKeys[k]; });
    if(stillUnresolved.length > 0){
      alert('Confirm or report every item before finishing — ' + stillUnresolved.length + ' item' + (stillUnresolved.length === 1 ? ' still needs' : 's still need') + ' a check.');
      return;
    }
    var receivedBy = (document.getElementById('receivedByInput').value || '').trim();
    if(!receivedBy){
      alert('Enter your name in "Received By" before finishing.');
      document.getElementById('receivedByInput').focus();
      return;
    }
    if(progressEnabled){
      submissionError='';
      if(!saveProgress()){render();return;}
      confirmFinish=true;render();
      var confirmation=document.getElementById('confirmSubmitBtn');if(confirmation)confirmation.scrollIntoView({block:'center',behavior:'smooth'});
      return;
    }
    if(!confirm('Finish the receiving check for ' + storeName + '? This locks in what was scanned.')) return;
    submissionInFlight = true;

    fetch('/api/submit-receiving-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        access: storeAccessToken,
        store: storeName,
        orderId: expected.orderId,
        orderName: expected.orderName,
        pickedBy: expected.pickedBy,
        receivedBy: receivedBy,
        expectedItems: expected.items,
        scannedCounts: scannedCounts,
        extraScans: extraScans,
        extraDetails: extraDetails,
      })
    })
      .then(function(r){ return r.json(); })
      .then(function(result){
        var main = document.getElementById('mainContent');
        if(!result.ok){
          submissionInFlight = false;
          main.innerHTML = '<div class="error-state">Could not submit: ' + escapeHtml(result.error || 'unknown error') + '</div>';
          return;
        }
        renderFinishedReport(result.report);
        watchReportStatus(result.report);
      })
      .catch(function(err){
        submissionInFlight = false;
        alert('Could not submit: ' + err.message);
      });
  }

  function prepareSubmission(){
    if(pendingSubmission || submissionInFlight || finishedReport || receiptConflict || draftMismatch) return;
    if(progressEnabled && blockedExtraCodes().length){submissionError='Verify every wrong/extra product code before submitting. Your draft is saved.';render();return;}
    if(pendingLookupCount){submissionError='Wait for barcode lookups to finish.';render();return;}
    if(!receivedByValue.trim() || expected.items.some(function(i){return i.status!=='missing'&&!resolvedKeys[itemKey(i)];})){
      confirmFinish=false;submissionError='Enter your name and confirm every item, including zeros.';render();return;
    }
    var bytes=new Uint8Array(16);window.crypto.getRandomValues(bytes);
    var id=Array.from(bytes).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    pendingSubmission=JSON.parse(JSON.stringify({submissionId:id,store:storeName,
      orderId:expected.orderId,orderName:expected.orderName,pickedBy:expected.pickedBy,
      receivedBy:receivedByValue.trim(),expectedItems:expected.items,scannedCounts:scannedCounts,
      extraScans:extraScans,extraDetails:extraDetails}));
    confirmFinish=false;
    if(!saveProgress()){render();return;}
    sendPendingReceipt();
  }

  function sendPendingReceipt(){
    if(!pendingSubmission || submissionInFlight || finishedReport || receiptConflict || draftMismatch) return;
    if(!saveProgress()){render();return;}
    submissionInFlight=true;submissionError='';render();
    var body=Object.assign({},pendingSubmission,{access:storeAccessToken});
    fetch('/api/submit-receiving-check',{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),
      signal:AbortSignal.timeout(20000)
    }).then(function(r){
      return r.json().then(function(data){return {status:r.status,ok:r.ok,data:data};});
    }).then(function(result){
      submissionInFlight=false;
      if(result.ok && result.data.ok && result.data.report){
        finishedReport=result.data.report;pendingSubmission=null;saveProgress();
        renderFinishedReport(result.data.report);watchReportStatus(result.data.report);return;
      }
      submissionError=result.data.error || 'The server could not confirm submission. Your counts are saved; retry safely.';
      if(result.status===409 && result.data.code==='receipt_conflict') receiptConflict=true;
      // Only an explicit pre-save validation rejection may unlock editing.
      // Timeouts, bad JSON and all unknown outcomes must resend identical counts.
      if(result.status===400 && result.data.notSaved===true){pendingSubmission=null;var saved=saveProgress();if(saved&&result.data.code==='delivery_details_changed'){location.reload();return;}}
      render();
    }).catch(function(){
      submissionInFlight=false;
      submissionError='Connection interrupted or confirmation unavailable. Your counts are saved. Use Retry / confirm saved receipt; it cannot create a second receipt.';
      render();
    });
  }

  window.addEventListener('pagehide',function(){saveProgress();});

  loadExpected();
  setInterval(refreshCurrentDelivery,30000);
  window.addEventListener('pageshow',refreshCurrentDelivery);
  window.addEventListener('focus',refreshCurrentDelivery);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refreshCurrentDelivery();});
})();
</script>

</body>
</html>
