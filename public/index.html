<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hummus Fit — Receiving QR Codes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --card:#FFFFFF; --card-2:#F5F7F7; --line:#E7EAEA;
    --navy:#182B3A; --dim:#6B7A80; --teal:#2BBFAA; --orange:#E8612C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--navy); font-family:'Inter',sans-serif; padding:24px 4vw 60px;}
  .logo-mark{ margin-bottom:10px; }
  .logo-mark img{ height:20px; width:auto; display:block; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
  h1{ font-family:'Poppins', sans-serif; font-weight:800; font-size:32px; margin-bottom:8px; }
  .hint{ color:var(--dim); font-size:14px; margin-bottom:26px; max-width:560px; line-height:1.6; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  .store-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; text-align:center;
  }
  .store-card h2{ font-family:'Poppins', sans-serif; font-weight:700; font-size:17px; margin-bottom:12px; }
  .store-card img{ width:100%; max-width:200px; border-radius:8px; border:1px solid var(--line); }
  .store-card .print-hint{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--dim); margin-top:10px; }
  a.reports-link{
    display:inline-block; margin-top:24px; color:var(--orange); font-weight:700;
    font-family:'JetBrains Mono', monospace; font-size:12px; text-decoration:none;
  }
</style>
</head>
<body>

<div class="logo-mark"><img src="/assets/logo.png" alt="Hummus Fit"></div>
<div class="eyebrow">Receiving</div>
<h1>Store QR Codes</h1>
<div class="hint">Print each one and stick it up permanently at that store's receiving area — same code every day, never needs to change.</div>

<div class="grid" id="grid"></div>
<a class="reports-link" href="/reports">→ View the live Delivery Accuracy report</a>

<script>
  fetch('/api/stores').then(function(r){ return r.json(); }).then(function(data){
    var grid = document.getElementById('grid');
    grid.innerHTML = data.stores.map(function(store){
      return '<div class="store-card">'
        + '<h2>' + store.replace(/</g,'&lt;') + '</h2>'
        + '<img src="/api/qr/' + encodeURIComponent(store) + '" alt="QR code for ' + store.replace(/</g,'&lt;') + '">'
        + '<div class="print-hint">Scan Me to Check Your Delivery</div>'
        + '</div>';
    }).join('');
  });
</script>

</body>
</html>
